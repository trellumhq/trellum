<div class="panel"><form class="inline" method="post">{% csrf_token %}<label for="groupAddMember">Member to add</label><select id="groupAddMember" name="user_id" aria-label="Member to add" data-choice-picker data-picker-label="Member" data-picker-placeholder="Choose a member" data-unavailable-label="Selected member is unavailable" data-choice-source="/orgs/{{ org.slug }}/settings/groups/{{ group.pk }}/member-choices?kind=addable"><option value="">Choose a member</option>{% for m in addable_members %}<option value="{{ m.user_id }}"{% if selected_addable.user_id == m.user_id %} selected{% endif %}>{{ m.user.email }}</option>{% endfor %}</select><button class="ui-btn primary" name="action" value="add_user" type="submit">Add member</button><label for="addableSearch">Find member</label><input id="addableSearch" name="member_q" value="{{ member_q }}"><button class="ui-btn ghost" name="action" value="browse_member">Search available members</button>{% if addable_page.has_previous %}<button class="ui-btn ghost" name="action" value="browse_member" formaction="?tab=members&member_page={{ addable_page.previous_page_number }}">Previous members</button>{% endif %}<span>{{ addable_page.start_index }}–{{ addable_page.end_index }} of {{ addable_page.paginator.count }}</span>{% if addable_page.has_next %}<button class="ui-btn ghost" name="action" value="browse_member" formaction="?tab=members&member_page={{ addable_page.next_page_number }}">Next members</button>{% endif %}</form></div>
