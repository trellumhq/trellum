{% if addable_members %}<div class="panel"><form class="inline" method="post">{% csrf_token %}<input type="hidden" name="action" value="add_user"><select name="user_id" aria-label="Member to add" data-choice-picker data-picker-label="Member" data-picker-placeholder="Choose a member" data-picker-empty-state="No members are available to add."{% if addable_searchable %} data-choice-source="/orgs/{{ org.slug }}/settings/groups/{{ group.pk }}/member-choices?kind=addable"{% endif %}>{% for m in addable_members %}<option value="{{ m.user_id }}">{{ m.user.email }}</option>{% endfor %}</select><button class="ui-btn primary" type="submit">Add member</button></form></div>{% endif %}
