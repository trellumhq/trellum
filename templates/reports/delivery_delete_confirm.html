{% extends "base.html" %}
{% block title %}Delete delivery schedule — trellum{% endblock %}
{% block content %}
<header class="page-head ui-form-rail"><div class="ui-label page-kicker">Studio · Deliveries</div><h1>Delete delivery schedule</h1><p>{{ report.name|default:report.slug }}</p></header>
<section class="ui-form-section ui-form-rail" aria-labelledby="delete-delivery-title"><h2 id="delete-delivery-title">Confirm deletion</h2>
  <p>{{ confirmation }}</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="delete">
    <input type="hidden" name="confirm_delete" value="yes">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <button type="submit" class="ui-btn danger">Confirm deletion</button>
    <a class="ui-btn ghost" data-console-nav href="{{ return_to }}">Cancel</a>
  </form>
</section>
{% endblock %}
