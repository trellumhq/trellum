{% extends "base.html" %}
{% block title %}Password required — trellum{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:14vh auto 0">
  <h1>Password required</h1>
  <p class="muted">This shared report is password-protected.</p>
  {% if error %}<div class="ui-flash error">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="ui-field">
      <label class="ui-label" for="share-password">Password</label>
      <input
        class="ui-input"
        type="password"
        name="password"
        id="share-password"
        autocomplete="off"
        autofocus
        required
      >
    </div>
    <button type="submit" class="ui-btn primary">View report</button>
  </form>
</div>
{% endblock %}
