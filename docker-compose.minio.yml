# Object-storage override: MinIO standing in for S3, and — the point of the
# exercise — runners that do NOT share a data volume with the web process.
#
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml \
#     --profile split up -d --scale runner=3
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml stop worker
#
# See docs/object-storage-testing.md for the full recipe. Development only —
# never ship. MinIO runs with well-known credentials and no TLS.
#
# Why the separate volumes matter: with everything on one `trellum-data` volume, a
# passing test proves nothing — the shared filesystem would serve the reports
# whether or not object storage worked at all. Giving each runner its own
# volume is what makes the bucket the only path from a build to a reader, so a
# report that renders is a report that genuinely round-tripped through S3.
#
# What this deliberately does NOT make work: uploaded data-source files. Those
# travel the other way (the web process writes them, a build reads them) and
# still live on local disk, so a file-backed data source will fail here. That
# is the honest current boundary, not a bug in the setup — use git-backed
# reports to exercise this.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # API and the browser console. Loopback only.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: create the bucket the portal publishes to. Idempotent, so
  # bringing the stack up twice is fine.
  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/trellum-reports &&
      echo 'bucket ready'
      "

  web:
    environment: &storage_env
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-trellum}:${POSTGRES_PASSWORD:-trellum}@db:5432/${POSTGRES_DB:-trellum_portal}}
      TRELLUM_STORAGE_BACKEND: "s3"
      TRELLUM_REPORTS_BUCKET: "trellum-reports"
      TRELLUM_STORAGE_ENDPOINT_URL: "http://minio:9000"
      TRELLUM_STORAGE_ACCESS_KEY: "minioadmin"
      TRELLUM_STORAGE_SECRET_KEY: "minioadmin"
      TRELLUM_STORAGE_REGION: "us-east-1"
    depends_on:
      minio-bucket:
        condition: service_completed_successfully

  coordinator:
    environment: *storage_env

  runner:
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-trellum}:${POSTGRES_PASSWORD:-trellum}@db:5432/${POSTGRES_DB:-trellum_portal}}
      TRELLUM_SANDBOX: ${TRELLUM_SANDBOX:-docker}
      TRELLUM_SANDBOX_IMAGE: ${TRELLUM_RUNNER_IMAGE:-trellum-runner:dev}
      TRELLUM_STORAGE_BACKEND: "s3"
      TRELLUM_REPORTS_BUCKET: "trellum-reports"
      TRELLUM_STORAGE_ENDPOINT_URL: "http://minio:9000"
      TRELLUM_STORAGE_ACCESS_KEY: "minioadmin"
      TRELLUM_STORAGE_SECRET_KEY: "minioadmin"
      TRELLUM_STORAGE_REGION: "us-east-1"
    volumes:
      # NOT trellum-data. Each replica gets its own anonymous volume at /data, so no
      # runner can see another's disk and none of them can see the web
      # process's. Replaces the base file's list rather than merging with it.
      - /data
      - backups:/backups:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      minio-bucket:
        condition: service_completed_successfully

volumes:
  minio-data:
