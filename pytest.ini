; Django test suite configuration (pytest-django).
; The legacy suite (portal/tests) is run separately in CI with plain pytest
; and an explicit path, so `testpaths` below never collects it.
[pytest]
DJANGO_SETTINGS_MODULE = trellum_portal.settings.test
testpaths = apps
python_files = test_*.py
markers =
    portal_e2e: live browser tests requiring the isolated PostgreSQL runner
    heavy: opt-in scale, browser-matrix and real-process tests (scripts/test.py portal --heavy or heavy)
    docker_sandbox: integration tests that need a real Docker daemon (skipped without one)
filterwarnings =
    ignore::DeprecationWarning:allauth
