{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ BRAND }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ BRAND }} builds interactive reports from your data, with definitions reviewed in Git and optional self-hosted scheduling and access control.{% endblock %}">
<link rel="icon" href="{% static 'brand/favicon.ico' %}" sizes="any">
<link rel="icon" href="{% static 'brand/favicon.svg' %}" type="image/svg+xml">
<link rel="icon" href="{% static 'brand/favicon-32.png' %}" type="image/png" sizes="32x32">
<link rel="canonical" href="{{ SITE_BASE_URL }}{{ request.path }}">
<meta property="og:site_name" content="{{ BRAND }}">
<meta property="og:title" content="{% block og_title %}{{ BRAND }} — {{ TAGLINE }}{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ SITE_BASE_URL }}{{ request.path }}">
<meta property="og:image" content="{{ SITE_BASE_URL }}{% static 'media/nova-play-social.png' %}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="672">
<meta property="og:image:alt" content="Nova Play game analytics in Trellum: player KPIs and daily active users by platform, using synthetic data.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ SITE_BASE_URL }}{% static 'media/nova-play-social.png' %}">
<meta name="twitter:image:alt" content="Nova Play game analytics in Trellum: player KPIs and daily active users by platform, using synthetic data.">
{% include "_theme_boot.html" %}
<link rel="stylesheet" href="{% static 'site.css' %}?v={{ ASSET_V }}">
{% block head_extra %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% include "_shell.html" %}
<main id="main">{% block content %}{% endblock %}</main>
{% include "_footer.html" %}
<script src="{% static 'site.js' %}?v={{ ASSET_V }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
