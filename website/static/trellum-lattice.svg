<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- trellum lattice mark · light surfaces. Grid #C7CBE0, dots teal #0D9488 / violet #7C6FE0.
       Dark surfaces: grid #2E2E52, dots #2DD4BF / #9D8FF2. Monochrome: all currentColor. -->
  <g stroke="#C7CBE0" stroke-width="2.6">
    <line x1="8" y1="8" x2="8" y2="32"/>
    <line x1="20" y1="8" x2="20" y2="32"/>
    <line x1="32" y1="8" x2="32" y2="32"/>
  </g>
  <circle cx="8"  cy="32" r="4.4" fill="#0D9488"/>
  <circle cx="20" cy="20" r="4.4" fill="#7C6FE0"/>
  <circle cx="32" cy="8"  r="4.4" fill="#0D9488"/>
</svg>
