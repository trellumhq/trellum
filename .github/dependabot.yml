version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /trellum
      - /trellum/itest
      - /website
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ['*']
      python-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      action-dependencies:
        patterns: ['*']
      action-security:
        applies-to: security-updates
        patterns: ['*']
