name: benchmarks

# Full scaling benchmarks run for rendering/data changes via framework.yml,
# and remain available separately for manual validation.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmarks:
    name: browser benchmarks (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            trellum/requirements.txt
            trellum/requirements-drivers.txt
            trellum/requirements-drivers-common.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trellum/requirements.txt -r trellum/requirements-drivers.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run the slow benchmarks
        working-directory: trellum/demo
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.github/workflows${PYTHONPATH:+:$PYTHONPATH}"
          python -m pytest ../testing -q -m slow -s -p benchmark_metrics --durations=20 \
            --junitxml="$GITHUB_WORKSPACE/.test-results/benchmarks.xml"

      - name: Summarize benchmark outcomes and timings
        if: always()
        run: python .github/workflows/test_summary.py --junit .test-results/benchmarks.xml --out-dir .test-results/ci/benchmarks --title 'Framework scaling benchmarks'

      - name: Keep sanitized benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framework-benchmark-results
          path: .test-results/ci/benchmarks/
          if-no-files-found: ignore
          retention-days: 7
