name: framework

# Pull requests are the only automatic trigger. A push to main is the merge
# of an already-green PR, and the nightly schedule bought little per minute
# billed, so
# everything heavier than a grep is gated on whether the code it protects
# actually changed (see the `changes` job). GitHub counts a skipped job as
# passing for required status checks, so gated PRs stay mergeable.
on:
  # No branch filter: every pull request runs, whatever it targets. This is
  # the gate -- see the required status checks on `main`.
  #
  # Path-scoped since the monorepo: a control-plane-only PR should not pay for
  # Chromium and five containers. Note the reverse is deliberately NOT true --
  # portal.yml runs on framework changes too, because the framework is what
  # builds reports and its e2e is the only thing that proves that still works.
  pull_request:
    paths:
      - "trellum/**"
      - ".github/workflows/framework.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish the built wheel to PyPI. Leave this off for ordinary
          validation; publishing requires the protected PyPI environment and
          a public repository. See CONTRIBUTING.md and trellum/RELEASING.md.
        type: boolean
        default: false

# A superseded run is pure cost: when a PR gets a new push, kill the old run.
concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Ruff, configured in ruff.toml. The ruleset there is chosen rather than
    # maximal: it is the set where a hit means something is actually wrong,
    # plus import hygiene. A gate that fires hundreds of times on style
    # opinions is a gate people learn to bypass.
    #
    # Fast and dependency-free, so it runs first and fails in seconds.
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned. An unpinned linter turns somebody else's release into a red
      # build on a branch that changed nothing.
      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: ruff check
        # Scoped to trellum/: ruff.toml lives there and its ruleset is the
        # framework's, not the control plane's.
        working-directory: trellum
        run: ruff check . --output-format=github
  changes:
    # One cheap job classifies the diff; the jobs below key off its outputs.
    # `code` is anything that isn't documentation; `data` is the data path
    # that warrants the container matrix. On workflow_dispatch there is no
    # diff to classify, so everything runs.
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      data: ${{ steps.diff.outputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff below needs the merge-base with the PR's
          # target branch, which a shallow clone can't compute.
          fetch-depth: 0

      - name: Classify the diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=yes" >> "$GITHUB_OUTPUT"
            echo "data=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          # Narrow to what this workflow is responsible for -- but keep the
          # workflow itself in scope, or editing the pipeline never exercises
          # the pipeline. That is not hypothetical: folding the standalone
          # checks in here changed only this file, so every job skipped and
          # the new steps went untested.
          files=$(echo "$files" | grep -E '^trellum/|^\.github/workflows/framework\.yml' || true)
          if echo "$files" | grep -vE '^trellum/docs/|\.md$' | grep -q .; then
            echo "code=yes" >> "$GITHUB_OUTPUT"
          else
            echo "code=no" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(trellum/data/|trellum/itest/|trellum/requirements|\.github/workflows/framework\.yml)'; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          else
            echo "data=no" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: tests + demo build
    needs: changes
    if: needs.changes.outputs.code == 'yes'
    runs-on: ubuntu-latest
    # Normal run is well under 10 minutes. Without a cap, a wedged step rides
    # GitHub's 6-hour default -- a Chromium download stall has already burned
    # two full 360-minute runner slots on exactly that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            trellum/requirements.txt
            trellum/requirements-drivers.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-drivers.txt pulls in msal/google-auth so that
          # test_connections.py's OneDrive and Google Sheets tests run for
          # real in CI instead of skipping (they'd otherwise skip on a
          # core-only install).
          pip install -r trellum/requirements.txt -r trellum/requirements-drivers.txt pytest pytest-cov playwright

      # Without a browser, test_js_runtime.py and test_interactions.py skip
      # themselves -- roughly a hundred tests quietly doing nothing. Those are
      # the only tests that exercise the client-side runtime at all, so CI
      # pays the ~1 min to install Chromium rather than pretend.
      - name: Install Chromium for the browser tests
        timeout-minutes: 8
        run: |
          # The runner's Azure HTTP mirror can stall browser dependency downloads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          python -m playwright install --with-deps chromium

      # The WHOLE suite, not a hand-listed subset -- an unlisted file is a file
      # nobody runs, which is how test_interactions.py sat dead for months.
      # -m "not slow" drops only the browser benchmarks (minutes each); they
      # run on demand via the benchmarks job below.
      #
      # Run from trellum/demo, whose trellum/ shim makes the checkout
      # importable as `trellum` -- the same shape a consumer gets from the
      # published package. Paths inside stay relative to it (../testing,
      # ../.coveragerc), so only the working directory moves.
      - name: Framework test suite
        working-directory: trellum/demo
        run: |
          set -o pipefail
          python -m pytest ../testing -q -m "not slow" -rs \
            --cov=.. --cov-config=../.coveragerc \
            --cov-report=term --cov-report=json:/tmp/coverage.json \
            | tee /tmp/pytest.out

      # Coverage is reported, not gated on a percentage. A hard threshold on a
      # single number invites the cheapest possible test to clear it, which is
      # the opposite of the point. What IS gated is the frozen contract in
      # docs/COMPATIBILITY.md -- see testing/test_compatibility.py, which fails
      # if a documented surface changes shape.
      #
      # The floor below exists only to catch collapse: a run where the suite
      # silently stopped importing most of the package still "passes" without
      # it.
      - name: Coverage
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json

          data = json.load(open("/tmp/coverage.json"))
          total = data["totals"]["percent_covered"]
          files = data["files"]

          print("## Coverage\n")
          print(f"**{total:.1f}%** overall "
                f"({data['totals']['covered_lines']:,} of "
                f"{data['totals']['num_statements']:,} statements)\n")

          worst = sorted(
              ((f, m["summary"]["percent_covered"], m["summary"]["num_statements"])
               for f, m in files.items() if m["summary"]["num_statements"] >= 20),
              key=lambda r: r[1],
          )[:10]
          print("| Least covered | % | statements |")
          print("|---|---:|---:|")
          for name, pct, n in worst:
              print(f"| `{name}` | {pct:.0f} | {n} |")

          FLOOR = 55.0
          if total < FLOOR:
              raise SystemExit(
                  f"\nCoverage {total:.1f}% is below the {FLOOR}% floor. "
                  "That floor is a collapse detector, not a target -- a drop "
                  "this large usually means a module stopped being imported."
              )
          PY

      # Every optional dependency is installed above. The only expected skip
      # is the Windows-only NTFS stream test, which cannot run on this Linux
      # runner. Match its source file and exact reason; all other skips
      # remain fatal.
      - name: No test silently skipped
        run: |
          python .github/workflows/check_framework_skips.py --self-test
          python .github/workflows/check_framework_skips.py /tmp/pytest.out

      - name: Build every demo report
        working-directory: trellum/demo
        run: |
          python tools/make_fixtures.py
          python -m trellum.run --all --no-serve

      # The generated artifact must stand alone: with no `extensions` configured
      # there is no host in front of the report, so it must not reach for one.
      - name: Reports issue no host requests standalone
        working-directory: trellum/demo
        run: |
          if grep -rn "_fwHasHost=true" output/*/index.html; then
            echo "ERROR: reports built without extensions claim a host"
            exit 1
          fi
          echo "OK: no host assumed"

  integration:
    # The itest harness: every driver against a real server -- containers
    # for postgres (direct, and through an SSH bastion)/mysql/clickhouse/
    # sqlserver/trino and the bigquery emulator,
    # fakesnow in-process, sqlite/duckdb/file/api embedded -- plus a full
    # report build against two live engines. All containers run inside
    # this one runner; locally the identical command is
    # `python itest/run.py`. Engine selection is parametrization, never
    # skipping, so the no-skip philosophy of the tests job carries over
    # without interacting with it.
    name: integration (real data sources)
    # Only when something on the data path changed -- a docs or rendering
    # PR should not pay for five containers.
    needs: changes
    if: needs.changes.outputs.data == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: trellum/itest/requirements-itest.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trellum/itest/requirements-itest.txt

      - name: Light-matrix integration run
        working-directory: trellum
        run: python itest/run.py --profile s3 --engines postgres,postgres_ssh,mysql,clickhouse,sqlserver,redshift,bigquery,trino,fakesnow,sqlite,duckdb,file,api,s3

  package:
    # The framework has to keep working with no control plane anywhere near
    # it. That was easy to believe when it was its own repository; in a
    # monorepo it is exactly the kind of thing that rots silently, so it is a
    # gate.
    #
    # The wheel is BUILT and PROVEN on every PR. Publishing remains a separate
    # manual action protected by the PyPI environment below.
    name: wheel installs standalone
    needs: changes
    if: needs.changes.outputs.code == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the wheel
        working-directory: trellum
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: The wheel reports the repository's version
        run: |
          REPO_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' trellum/__init__.py)
          if ! ls dist/trellum-"$REPO_VERSION"-*.whl >/dev/null 2>&1; then
            echo "ERROR: no wheel for version $REPO_VERSION in dist/:"
            ls dist/
            exit 1
          fi
          echo "wheel matches trellum.__version__ = $REPO_VERSION"

      - name: The wheel carries AGPL metadata and notices
        run: |
          python - <<'PY'
          import glob
          from pathlib import Path
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          analyses = list(Path("trellum/demo/reports").glob("*/content.md"))
          if not analyses:
              raise SystemExit("demo source has no analysis content.md")
          analysis_files = [
              path for content in analyses
              for path in (content, *content.parent.glob("evidence/*"))
              if path.is_file()
          ]
          if not any(path.parent.name == "evidence" for path in analysis_files):
              raise SystemExit("demo analysis has no packaged evidence files")
          required = {
              "trellum/LICENSE",
              "trellum/THIRD-PARTY.md",
              "trellum/demo/assistant.md",
              *(path.as_posix() for path in analysis_files),
          }
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"wheel is missing required files: {missing}")
              for path in analysis_files:
                  packaged = path.as_posix()
                  if archive.read(packaged) != path.read_bytes():
                      raise SystemExit(f"wheel changed demo analysis file: {packaged}")
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              if "License-Expression: AGPL-3.0-only" not in metadata:
                  raise SystemExit("wheel metadata is missing AGPL-3.0-only")
              licence = archive.read("trellum/LICENSE").decode()
              if "GNU AFFERO GENERAL PUBLIC LICENSE" not in licence:
                  raise SystemExit("wheel does not contain the GNU AGPL text")
          PY

      # Installed into a clean interpreter, from a directory that is NOT the
      # repository, so nothing resolves by accident through the checkout.
      - name: Install it somewhere the repository cannot be seen
        run: |
          python -m venv /tmp/standalone
          /tmp/standalone/bin/pip install --upgrade pip
          /tmp/standalone/bin/pip install dist/*.whl

      - name: It imports, scaffolds and has no host
        working-directory: /tmp
        run: |
          /tmp/standalone/bin/python -c "import trellum; print('trellum', trellum.__version__)"
          /tmp/standalone/bin/trellum --help > /dev/null
          echo "console script OK"

          # The framework must not have dragged a web framework in with it.
          if /tmp/standalone/bin/python -c "import django" 2>/dev/null; then
            echo "ERROR: Django is installed alongside the framework wheel."
            echo "Something in trellum/pyproject.toml depends on the control plane."
            exit 1
          fi
          echo "no Django: the wheel carries no host"

          # A real consumer's first two commands, in an empty directory.
          mkdir -p /tmp/consumer && cd /tmp/consumer
          /tmp/standalone/bin/python -m trellum.init
          /tmp/standalone/bin/python -m trellum.new smoke-report --studio smoke --category Revenue
          test -f reports/smoke-report/report.yaml || {
            echo "ERROR: scaffolding produced no report.yaml"; find . -maxdepth 3; exit 1;
          }
          echo "scaffolded a project from the wheel alone"

          # A HALF-written report is the failure this guards against: the
          # scaffolder once died partway through on Windows, leaving a
          # truncated report.yaml and no generator.py. Check content, not
          # just existence -- except __init__.py, an empty package marker
          # that is supposed to be zero bytes.
          test -f reports/smoke-report/__init__.py || {
            echo "ERROR: reports/smoke-report/__init__.py missing"; exit 1; }
          for f in report.yaml generator.py queries.py; do
            test -s "reports/smoke-report/$f" || {
              echo "ERROR: reports/smoke-report/$f is missing or empty"
              ls -la reports/smoke-report/; exit 1; }
          done
          echo "scaffolded report is complete"

          # No portal-only dependency may have come along. This is the check
          # that would catch requirements.txt quietly gaining a scheduler or
          # an LLM SDK -- the dependency split being a fiction.
          fail=0
          for mod in django apscheduler jwt anthropic openai boto3; do
            if /tmp/standalone/bin/python -c "import $mod" 2>/dev/null; then
              echo "ERROR: portal-only dependency '$mod' came in with the wheel"
              fail=1
            fi
          done
          for pkg in trellum_portal apps; do
            if /tmp/standalone/bin/python -c "import $pkg" 2>/dev/null; then
              echo "ERROR: 'import $pkg' succeeded -- the control plane leaked"
              fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "no host, no portal-only dependencies"
          exit $fail

      # The scaffolded report must RUN, not merely exist. --test uses mock
      # data, so no database and no fixtures are needed.
      - name: The scaffolded report builds
        working-directory: /tmp/consumer
        run: /tmp/standalone/bin/python -m trellum.run reports/smoke-report --test --no-serve

      # And finally a REAL report with REAL data in a consumer layout: a
      # reports/ and data-sources/ at the project root, with the framework
      # installed rather than sitting beside them. This is the arrangement an
      # actual consumer project has.
      #
      # This step and the two above came from trellumhq/trellum-consumer-test,
      # a separate repository that proved the framework stands alone. It was
      # pinned to the framework as a submodule, so after the monorepo it was
      # testing a commit that no longer receives changes -- a gate that had
      # quietly stopped gating. Folded in here it runs on every framework
      # change instead of weekly, and cannot go stale.
      #
      # What that costs, stated plainly: the framework source now lives in the
      # same repository, so "no portal source on disk" is no longer proven by
      # a repository that contains none. It is proven instead by installing
      # the wheel into a venv outside the checkout and building from /tmp,
      # which is where every path above runs.
      - name: A real consumer project builds a real report
        run: |
          DEMO="$GITHUB_WORKSPACE/trellum/demo"

          # make_fixtures writes data-sources/demo.sqlite and events.yaml
          # RELATIVE to the project it runs from, so run it from the demo
          # project. Its --out takes a .sqlite path, not a directory.
          cd "$DEMO"
          /tmp/standalone/bin/python tools/make_fixtures.py --small

          # Assemble a consumer-shaped project in /tmp: reports/ and
          # data-sources/ at the root, framework INSTALLED rather than sitting
          # beside them. Note the trailing /. -- trellum.init already made
          # data-sources/, and `cp -r src dest` would nest it inside.
          cd /tmp/consumer
          cp -r "$DEMO/reports/player-overview" reports/
          cp -r "$DEMO/data-sources/." data-sources/
          cp "$DEMO/events.yaml" events.yaml

          /tmp/standalone/bin/python -m trellum.run reports/player-overview --no-serve
          test -s output/player-overview/index.html || {
            echo "ERROR: no built report"; find output -maxdepth 2; exit 1; }
          echo "built a real report from the installed wheel alone"

      - name: Keep the wheel for inspection
        uses: actions/upload-artifact@v4
        with:
          name: trellum-wheel
          path: dist/*.whl
          retention-days: 14

  publish:
    # DELIBERATELY MANUAL. Publishing is a release-owner action, not something
    # that should happen merely because a validation workflow is already wired.
    #
    # It exists so the path is written down and reviewed rather than improvised
    # during a release. Select the stable tag itself and set publish=true.
    name: publish to PyPI (manual approval)
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi          # a human approval gate, configured on the repo
    permissions:
      id-token: write          # trusted publishing; no API token to leak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: trellum-wheel
          path: dist

      - name: Refuse to publish from a private repository
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "ERROR: this repository is still private."
            echo "Publishing the framework to PyPI from here would put the"
            echo "package on a public index before the source it is built"
            echo "from is public. Make the repository public first."
            exit 1
          fi

      - name: Require a stable tag matching the wheel version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "ERROR: select a stable vX.Y.Z tag"; exit 1; }
          REPO_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' trellum/__init__.py)
          [ "v$REPO_VERSION" = "$GITHUB_REF_NAME" ] \
            || { echo "ERROR: $GITHUB_REF_NAME does not match trellum $REPO_VERSION"; exit 1; }

      - uses: pypa/gh-action-pypi-publish@release/v1

# The two on-demand lanes -- browser benchmarks and the vertica integration
# run -- live in their own workflow files (benchmarks.yml, vertica.yml) so
# each can be dispatched alone, without dragging the whole PR matrix (or a
# credential-less vertica failure) along with it.
