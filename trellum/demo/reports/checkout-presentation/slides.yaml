slides:
  - id: question
    layout: title
    title: The next growth opportunity is in your hand.
    text: |
      NORTHWIND / CHECKOUT OPPORTUNITY

      ### 63.2%

      of visits are on mobile. **Just 1 in 56 becomes a purchase.**

      | Mobile conversion | Desktop conversion | Mobile sessions |
      | --- | --- | --- |
      | **1.80%** | **5.24%** | **99,072** |

      September 2026 · All channels · Synthetic demo data
  - id: mobile
    layout: image-text
    title: The leak starts before payment.
    text: |
      **THE DIAGNOSIS / THREE POINTS OF FRICTION**

      Mobile trails desktop at **every buying step** shown here.
      By the final step, **1,875 of 3,657** mobile checkout starts
      do not become purchases.

      > Start with checkout, then work upstream. Investigate the experience
      > behind each step.

      Stage conversion = next-stage count ÷ prior-stage count.
      Audience differences may explain part of the gap.

      [Frozen evidence & methods](https://trellum.dev/demo/checkout-findings/#article-evidence)
    image: evidence/stage-comparison.png
    alt: "Derived from the frozen September synthetic counts. Product view to cart: mobile 16.6%, desktop 23.1%. Cart to checkout: mobile 41.3%, desktop 57.3%. Checkout to purchase: mobile 48.7%, desktop 68.7%. All pairs share a 0–100% scale."
  - id: comparison
    layout: image
    title: A small recovery could mean 183 more purchases.
    image: evidence/recovery-scenario.png
    alt: "Illustrative scenario, not a forecast or measured lift. At the same 3,657 mobile checkout starts, increasing checkout completion by 5 percentage points, from 48.73% to 53.73%, would add about 183 purchases: 1,782 to about 1,965. This is about 10.3% more mobile purchases. Assumes unchanged traffic, checkout starts and all earlier stages. Synthetic September 2026 baseline."
  - id: next-step
    layout: text
    title: Find the friction. Then earn the lift.
    text: |
      **THE DECISION / PRIORITIZE MOBILE CHECKOUT**

      1. **Check the signal**

         Reconcile checkout events. Compare channels and returning customers
         before attributing the gap to the experience.

      2. **Find the friction**

         Review shipping costs, form errors and payment failures on mobile.
         Choose one evidenced problem.

      3. **Test one fix**

         Define the audience, sample size and stopping rule. Compare purchases
         per eligible session against a randomized control.

      > **Guardrails:** revenue per session, payment success and refunds.
      > Reconsider if the gap disappears after measurement or audience checks.

      [Read the full analysis & assumptions](https://trellum.dev/demo/checkout-findings/)
      · Synthetic September 2026 data.
