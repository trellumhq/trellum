[pytest]
# The repository had no pytest config at all, which is part of why the test
# suite drifted: there was no single place saying what "the tests" are.

testpaths = testing

markers =
    slow: browser benchmarks that generate reports at 1k-100k rows. Minutes,
        not seconds. Excluded from CI with -m "not slow"; run them on demand
        with: pytest testing/test_performance.py -m slow -s

# No default -m filter on purpose. `pytest testing/` runs everything, so a
# marker cannot quietly hide a test from someone running the suite by hand --
# CI is the one place that opts out, and it does so visibly in the workflow.
