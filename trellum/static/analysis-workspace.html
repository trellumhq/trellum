<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Analysis workspace</title>
  <link rel="stylesheet" href="/_fw/review/workspace.css">
</head>
<body>
  <main class="fw-workspace" id="workspace" aria-live="off">
    <header class="fw-header">
      <div><p class="fw-eyebrow">Local review</p><h1 id="analysis-name">Analysis workspace</h1></div>
      <div class="fw-session"><button id="global-select" type="button" class="fw-button" aria-pressed="false" hidden tabindex="-1" aria-hidden="true">Select</button><span id="session-status" role="status">Connecting…</span><button id="end-session" type="button" class="fw-button">End session</button></div>
    </header>
    <nav class="fw-tabs" aria-label="Workspace panes">
      <button type="button" data-tab="analysis" aria-selected="true">Analysis</button>
      <button type="button" data-tab="reports" aria-selected="false">Reports</button>
      <button type="button" data-tab="queue" aria-selected="false">Queue <span id="queue-count">0</span></button>
    </nav>
    <section class="fw-layout">
      <section class="fw-pane fw-analysis-pane is-active" data-pane="analysis" aria-label="Analysis">
        <div class="fw-pane-head"><h2>Analysis</h2></div>
        <iframe id="fw-workspace-analysis" title="Analysis report" allowfullscreen></iframe>
      </section>
      <section class="fw-pane fw-reports-pane" data-pane="reports" aria-label="Source reports">
        <div class="fw-pane-head fw-report-head"><h2>Reports</h2><label for="source-select">Source report</label><select id="source-select"><option value="">Loading reports…</option></select><button type="button" id="open-report" class="fw-button">Open report</button><button type="button" id="retry-build" class="fw-button" hidden>Retry build</button></div>
        <p id="source-status" class="fw-source-status" aria-live="polite">Choose a source report.</p>
        <iframe id="fw-workspace-report" title="Source report" allowfullscreen hidden></iframe>
      </section>
      <section class="fw-pane fw-queue-pane" data-pane="queue" aria-label="Feedback queue and chat">
        <div class="fw-pane-head"><h2>Queue &amp; chat</h2></div>
        <div id="reply-list" class="fw-replies" aria-live="polite"></div>
        <div id="selection-box" class="fw-selection" hidden aria-hidden="true">
          <div class="fw-selection-context" id="selection-context"></div>
          <label for="selection-note">What should change?</label><textarea id="selection-note" rows="3" placeholder="Describe the change"></textarea>
          <div class="fw-row"><button type="button" id="queue-selection" class="fw-button fw-primary">Add to queue</button><button type="button" id="dismiss-selection" class="fw-button">Cancel</button></div>
          <p id="capture-status" class="fw-help" role="status"></p>
        </div>
        <ul id="queue-list" class="fw-queue-list"></ul>
        <label for="chat-note" hidden>Feedback</label><textarea id="chat-note" rows="3" placeholder="Describe what should change…" hidden aria-hidden="true"></textarea>
        <div class="fw-row"><button type="button" id="queue-send" class="fw-button" hidden>Queue</button><button type="button" id="send" class="fw-button fw-primary">Send to agent</button></div>
        <p id="send-status" role="status" class="fw-help"></p>
      </section>
    </section>
  </main>
  <script>window._fwWorkspaceConfig = window._fwWorkspaceConfig || __FW_WORKSPACE_CONFIG__;</script>
  <script src="/_fw/review/workspace.js" defer></script>
</body>
</html>
