<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Analysis workspace</title>
  <link rel="stylesheet" href="/_fw/review/workspace.css">
</head>
<body>
  <main class="fw-workspace" id="workspace">
    <header class="fw-header fw-chrome">
      <div class="fw-heading"><p class="fw-eyebrow">Analysis workspace</p><h1 id="analysis-name">Local analysis</h1></div>
      <div class="fw-session"><span id="session-status" role="status">Connecting…</span><button id="queue-toggle" data-tab="queue" type="button" class="fw-button" aria-haspopup="dialog" aria-controls="queue-dialog" aria-expanded="false">Queue <span id="queue-count" class="fw-count">0</span></button><button id="end-session" type="button" class="fw-button">End session</button></div>
    </header>
    <div class="fw-toolbar fw-chrome">
      <nav class="fw-tabs" aria-label="Workspace pages">
        <button id="analysis-tab" type="button" data-tab="analysis" aria-current="page" aria-controls="analysis-pane">Analysis</button>
        <button id="reports-tab" type="button" data-tab="reports" aria-controls="reports-pane">Reports</button>
      </nav>
      <div class="fw-report-head" id="source-controls" hidden><label for="source-select">Source report</label><select id="source-select"><option value="">Loading reports…</option></select><button type="button" id="open-report" class="fw-button">Open report</button><button type="button" id="retry-build" class="fw-button" hidden>Retry build</button></div>
      <div class="fw-view-actions"><button id="global-select" type="button" class="fw-button" aria-pressed="false" disabled>Select element</button><button type="button" id="content-only" class="fw-button" disabled>Analysis only</button></div>
    </div>
    <p id="workspace-status" class="fw-notice fw-chrome" role="status" hidden></p>
    <section class="fw-layout">
      <section id="analysis-pane" class="fw-pane fw-analysis-pane is-active" data-pane="analysis" aria-label="Analysis">
        <iframe id="fw-workspace-analysis" title="Analysis report" allowfullscreen></iframe>
      </section>
      <section id="reports-pane" class="fw-pane fw-reports-pane" data-pane="reports" aria-label="Source reports" hidden>
        <p id="source-status" class="fw-source-status fw-chrome" aria-live="polite">Choose a source report.</p>
        <iframe id="fw-workspace-report" title="Source report" allowfullscreen hidden></iframe>
      </section>
    </section>
    <button type="button" id="exit-content-only" class="fw-button fw-clean-exit" hidden>Back to workspace <span aria-hidden="true">· Esc</span></button>
    <p id="content-only-hint" class="fw-clean-hint" role="status" hidden>Press Escape or use Back to workspace to return.</p>
  </main>
  <dialog id="queue-dialog" class="fw-queue-dialog" aria-labelledby="queue-title">
    <div class="fw-queue-shell">
      <header class="fw-queue-head"><div><h2 id="queue-title">Queue &amp; chat</h2><p id="queue-summary" class="fw-help">No items queued</p></div><button type="button" id="queue-close" class="fw-button" aria-label="Close queue" autofocus>Close</button></header>
      <div class="fw-queue-scroll"><ul id="queue-list" class="fw-queue-list"></ul><section aria-label="Agent replies"><div id="reply-list" class="fw-replies" aria-live="polite"></div></section></div>
      <div class="fw-queue-footer"><label for="chat-note">Message the agent</label><p id="note-context" class="fw-help"></p><textarea id="chat-note" rows="3" placeholder="Describe what should change…"></textarea><div class="fw-row"><button type="button" id="send" class="fw-button fw-primary">Send to agent</button></div><p id="send-status" role="status" class="fw-help"></p></div>
    </div>
  </dialog>
  <script>window._fwWorkspaceConfig = window._fwWorkspaceConfig || __FW_WORKSPACE_CONFIG__;</script>
  <script src="/_fw/review/workspace.js" defer></script>
</body>
</html>
